[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-video-toolkit"
version = "0.1.0"
description = "A small, manifest-driven FFmpeg toolkit for cinematic travel-video edits"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "ysyyork"}]
dependencies = []

[project.scripts]
tripcut = "travel_video_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
