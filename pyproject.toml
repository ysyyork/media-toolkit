[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-toolkit"
version = "0.1.0"
description = "A Python toolkit for travel video editing and mask-guided photo processing"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "ysyyork"}]
dependencies = []

[project.scripts]
tripcut = "travel_video_editor.cli:main"
tripimage = "travel_video_editor.image_cli:main"

[project.optional-dependencies]
image = ["numpy>=1.26", "Pillow>=10", "opencv-python-headless>=4.9"]
semantic = ["onnxruntime>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]
